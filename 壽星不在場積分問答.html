
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --success-color: #2f855a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.15);
            background-color: #edf2f7;
        }

        .upload-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #edf2f7;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
            border: 2px dashed #cbd5e0;
        }

        .upload-placeholder:hover {
            background: #e2e8f0;
            border-color: var(--accent-color);
        }

        .party-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .party-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e0;
            border-radius: 10px;
            font-size: 14px;
            color: #000000;
            font-weight: 600;
            box-sizing: border-box;
            transition: all 0.2s;
            background: #f7f9fc;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #f1f3f9;
            color: var(--text-primary);
            border: 1.5px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-success {
            background: #38a169;
            color: white;
        }

        .btn-success:hover {
            background: #2f855a;
        }

        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .question-card {
            background: #fcfaff;
            border: 2px solid rgba(108, 92, 231, 0.12);
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .answer-text {
            font-size: 15px;
            color: var(--success-color);
            margin-top: 15px;
            font-weight: 700;
            background: #f0fff4;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #c6f6d5;
        }

        .counter-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        /* Player upload item styling */
        .player-row {
            display: flex;
            align-items: center;
            background: #f7f9fc;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .player-img-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 12px;
            overflow: hidden;
            border: 2.5px solid #6c5ce7;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.1);
            position: relative;
        }

        .player-img-btn .avatar-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-img-btn .default-emoji {
            font-size: 22px;
        }

        .player-img-btn .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #6c5ce7;
            color: white;
            font-size: 8px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-name-text {
            font-weight: 700;
            color: var(--text-primary);
            flex-grow: 1;
            text-align: left;
            font-size: 15px;
        }

        /* Participant score grid during playing */
        .score-selection-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 15px 0 10px 0;
            text-align: left;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .score-item {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1.5px solid #edf2f7;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .score-item.selected {
            background: #f0f5ff;
            border-color: #3182ce;
        }

        .score-item-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            border: 1.5px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf2f7;
        }

        .score-item-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .score-item-avatar .emoji {
            font-size: 16px;
        }

        .score-item-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            flex-grow: 1;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-checkbox {
            margin-left: 5px;
            pointer-events: none;
        }

        /* Leaderboard Page */
        .leaderboard-list {
            margin: 25px 0;
            text-align: left;
        }

        .leaderboard-row {
            display: flex; 
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border: 1.5px solid #edf2f7;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.01);
        }

        .leaderboard-row.rank-0 { border-color: #ecc94b; background: #fffdf5; }
        .leaderboard-row.rank-1 { border-color: #cbd5e0; background: #fafbfc; }
        .leaderboard-row.rank-2 { border-color: #ed8936; background: #fffaf0; }

        .rank-num {
            font-size: 16px;
            font-weight: 800;
            width: 30px;
            color: var(--text-primary);
        }

        .lead-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf2f7;
            overflow: hidden;
        }

        .lead-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lead-avatar .emoji {
            font-size: 24px;
        }

        .lead-name {
            font-size: 15px;
            font-weight: 700;
            flex-grow: 1;
            color: var(--text-primary);
        }

        .lead-score {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-color);
            background: rgba(108, 92, 231, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <!-- Birthday Person Picture Section -->
    <div class="avatar-container">
        <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="loadImage(event)">
        <div id="upload-view" class="upload-placeholder" onclick="document.getElementById('image-input').click()">
            <span>📷</span>
            <span style="margin-top: 5px;">上傳壽星照片</span>
        </div>
        <img id="avatar-img" class="avatar hidden" onclick="document.getElementById('image-input').click()">
    </div>

    <div class="party-title" id="main-party-title">🎉 缺席的壽星生日會</div>
    <div class="party-subtitle" id="main-party-subtitle">—— 他/她不在，我們隨便問 ——</div>

    <!-- PHASE 1: PARTICIPANTS SETUP -->
    <div id="phase-participants">
        <div class="badge">1. 登記與壽星設定</div>

        <!-- Birthday Person Name Input -->
        <div class="input-group" style="margin-bottom: 20px; background: #fbfaff; padding: 15px; border-radius: 12px; border: 1.5px solid rgba(108, 92, 231, 0.15);">
            <label class="input-label" style="color: var(--accent-color);">👑 壽星的名字</label>
            <input type="text" id="birthday-name-input" value="壽星" oninput="updateBirthdayName(this.value)" placeholder="請輸入壽星名字...">
        </div>

        <div class="input-group">
            <label class="input-label">登記參賽者名稱</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="player-name-input" placeholder="輸入參賽者名字...">
                <button class="btn btn-primary" onclick="addPlayer()" style="margin: 0; width: auto; padding: 10px 20px;">新增</button>
            </div>
        </div>

        <!-- Hidden input for participant photo -->
        <input type="file" id="player-image-input" accept="image/*" style="display: none;" onchange="loadPlayerImage(event)">

        <div id="players-list-container" style="margin: 20px 0; max-height: 200px; overflow-y: auto;">
            <!-- Dynamic list of players -->
        </div>

        <button class="btn btn-success" onclick="goToSetupQuestions()" style="margin-top: 10px;">下一步：去出題 ➔</button>
    </div>

    <!-- PHASE 2: ADD QUESTIONS -->
    <div id="phase-setup" class="hidden">
        <div class="badge">2. 題目設定階段</div>

        <div class="input-group">
            <label class="input-label" id="q-label">關於壽星的趣味問題</label>
            <input type="text" id="input-question" placeholder="例如：他最害怕哪種蔬菜？">
        </div>

        <div class="input-group">
            <label class="input-label">標準解答</label>
            <input type="text" id="input-answer" placeholder="例如：苦瓜，看到會尖叫">
        </div>

        <button class="btn btn-primary" onclick="addQuestion()" style="margin-top: 10px;">新增題目</button>
        <button class="btn btn-danger" id="btn-lock" onclick="lockQuestions()" style="margin-top: 10px;">🔒 結束出題（進入挑戰）</button>

        <div class="counter-info" id="q-counter" style="margin-top: 15px;">目前已累積 0 個題目</div>
    </div>

    <!-- PHASE 3: PLAY -->
    <div id="phase-play" class="hidden">
        <div class="badge">3. 派對搶答階段</div>

        <div class="question-card">
            <div class="question-text" id="display-question">準備好開始了嗎？</div>
            <div id="display-answer" class="answer-text" style="display: none;">答案</div>
        </div>

        <!-- Interactive score awarding panel, displayed only after answer is shown -->
        <div id="scoring-panel" class="hidden">
            <div class="score-selection-title">✓ 選擇答對的參賽者：</div>
            <div class="score-grid" id="score-grid-container"></div>
            <button class="btn btn-success" onclick="confirmScores()">儲存得分並繼續</button>
        </div>

        <button class="btn btn-primary" id="btn-draw-main" onclick="drawQuestion()">🎲 隨機抽取一題</button>
        <button class="btn btn-secondary" id="btn-show-ans" onclick="showAnswer()" style="display: none;">👁️ 顯示答案</button>
        <button class="btn btn-success hidden" id="btn-settlement-trigger" onclick="goToSettlement()">🏆 結算成績</button>

        <div class="counter-info" id="play-counter">剩餘題目：0 / 總數：0</div>
    </div>

    <!-- PHASE 4: LEADERBOARD -->
    <div id="phase-settlement" class="hidden">
        <div class="badge" style="background: rgba(236, 201, 75, 0.1); color: #ecc94b;">👑 最終榮譽排行榜</div>
        <div class="party-title" id="leaderboard-title">🏆 誰最懂壽星？</div>
        <div class="party-subtitle" id="leaderboard-subtitle">—— 恭喜以下獲勝者！ ——</div>

        <div class="leaderboard-list" id="leaderboard-container"></div>

        <button class="btn btn-secondary" onclick="restartGame()">🔄 重新開始新一局</button>
    </div>
</div>

<script>
    let birthdayPhotoData = "";
    let birthdayName = "壽星";
    let questions = [];
    let remainingQuestions = [];
    let currentQuestion = null;

    // Participants array
    let players = [];
    let currentlyUploadingPlayerIndex = null;

    // ----------------- BIRTHDAY NAME HANDLER -----------------
    function updateBirthdayName(val) {
        birthdayName = val.trim() || "壽星";
        // Dynamic title update
        document.getElementById('main-party-title').innerText = `🎉 缺席的${birthdayName}生日會`;
        document.getElementById('main-party-subtitle').innerText = `—— ${birthdayName}不在，我們隨便問 ——`;
        document.getElementById('q-label').innerText = `關於 ${birthdayName} 的趣味問題`;
        document.getElementById('leaderboard-title').innerText = `🏆 誰最懂 ${birthdayName}？`;
    }

    // ----------------- PHOTO HANDLERS -----------------
    function loadImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const img = document.getElementById('avatar-img');
            img.src = reader.result;
            birthdayPhotoData = reader.result;
            img.classList.remove('hidden');
            document.getElementById('upload-view').classList.add('hidden');
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    function triggerPlayerImageUpload(index) {
        currentlyUploadingPlayerIndex = index;
        document.getElementById('player-image-input').click();
    }

    function loadPlayerImage(event) {
        if (currentlyUploadingPlayerIndex === null) return;
        const reader = new FileReader();
        reader.onload = function() {
            players[currentlyUploadingPlayerIndex].avatar = reader.result;
            updatePlayersListView();
            currentlyUploadingPlayerIndex = null;
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    // ----------------- PARTICIPANTS LOGIC -----------------
    function addPlayer() {
        const nameInput = document.getElementById('player-name-input');
        const name = nameInput.value.trim();
        if (!name) {
            alert('請輸入名字！');
            return;
        }
        players.push({
            name: name,
            avatar: null,
            score: 0
        });
        nameInput.value = '';
        updatePlayersListView();
        nameInput.focus();
    }

    function updatePlayersListView() {
        const container = document.getElementById('players-list-container');
        container.innerHTML = '';
        players.forEach((player, index) => {
            const row = document.createElement('div');
            row.className = 'player-row';

            const avatarHtml = player.avatar
                ? `<img src="${player.avatar}" class="avatar-preview">`
                : `<span class="default-emoji">👤</span>`;

            row.innerHTML = `
                <div class="player-img-btn" onclick="triggerPlayerImageUpload(${index})" title="點擊上傳頭貼">
                    ${avatarHtml}
                    <div class="camera-badge">📷</div>
                </div>
                <div class="player-name-text">${player.name}</div>
                <button class="btn btn-danger" onclick="removePlayer(${index})" style="margin: 0; width: auto; padding: 5px 12px; font-size: 12px; border-radius: 6px;">刪除</button>
            `;
            container.appendChild(row);
        });
    }

    function removePlayer(index) {
        players.splice(index, 1);
        updatePlayersListView();
    }

    function goToSetupQuestions() {
        if (players.length === 0) {
            alert('至少需要登記一位參賽者才能開始遊戲唷！');
            return;
        }
        document.getElementById('phase-participants').classList.add('hidden');
        document.getElementById('phase-setup').classList.remove('hidden');
    }

    // ----------------- QUESTIONS LOGIC -----------------
    function addQuestion() {
        const qInput = document.getElementById('input-question');
        const aInput = document.getElementById('input-answer');

        const qText = qInput.value.trim();
        const aText = aInput.value.trim();

        if (!qText || !aText) {
            alert('請填寫完整的問題與解答！');
            return;
        }

        questions.push({ question: qText, answer: aText });

        qInput.value = '';
        aInput.value = '';

        document.getElementById('q-counter').innerText = `目前已累積 ${questions.length} 個題目`;
        qInput.focus();
    }

    function lockQuestions() {
        if (questions.length === 0) {
            alert('請至少新增一個題目才能開始遊戲喔！');
            return;
        }
        if (confirm('確定結束出題嗎？鎖定後將即刻開啟搶答！')) {
            remainingQuestions = [...questions];
            document.getElementById('phase-setup').classList.add('hidden');
            document.getElementById('phase-play').classList.remove('hidden');
            updatePlayCounter();
        }
    }

    function updatePlayCounter() {
        document.getElementById('play-counter').innerText = `剩餘可抽題目：${remainingQuestions.length} / 總題數：${questions.length}`;
    }

    // ----------------- PLAYING & SCORING LOGIC -----------------
    function drawQuestion() {
        if (remainingQuestions.length === 0) {
            return;
        }

        document.getElementById('scoring-panel').classList.add('hidden');

        const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
        currentQuestion = remainingQuestions.splice(randomIndex, 1)[0];

        document.getElementById('display-question').innerText = currentQuestion.question;

        const ansDiv = document.getElementById('display-answer');
        ansDiv.innerText = `💡 答案：${currentQuestion.answer}`;
        ansDiv.style.display = 'none';

        document.getElementById('btn-draw-main').style.display = 'none';
        document.getElementById('btn-show-ans').style.display = 'block';
        updatePlayCounter();
    }

    function showAnswer() {
        if (!currentQuestion) return;

        document.getElementById('display-answer').style.display = 'inline-block';
        document.getElementById('btn-show-ans').style.display = 'none';

        renderScoringGrid();
        document.getElementById('scoring-panel').classList.remove('hidden');
    }

    function renderScoringGrid() {
        const container = document.getElementById('score-grid-container');
        container.innerHTML = '';
        players.forEach((player, index) => {
            const div = document.createElement('div');
            div.className = 'score-item';
            div.onclick = () => togglePlayerSelect(div, index);

            const avatarImgHtml = player.avatar
                ? `<img src="${player.avatar}">`
                : `<span class="emoji">👤</span>`;

            div.innerHTML = `
                <div class="score-item-avatar">${avatarImgHtml}</div>
                <span class="score-item-name">${player.name}</span>
                <input type="checkbox" class="score-checkbox" id="check-${index}">
            `;
            container.appendChild(div);
        });
    }

    function togglePlayerSelect(element, index) {
        const checkbox = document.getElementById(`check-${index}`);
        checkbox.checked = !checkbox.checked;
        if (checkbox.checked) {
            element.classList.add('selected');
        } else {
            element.classList.remove('selected');
        }
    }

    function confirmScores() {
        players.forEach((player, index) => {
            const checkbox = document.getElementById(`check-${index}`);
            if (checkbox && checkbox.checked) {
                player.score += 1;
            }
        });

        currentQuestion = null;
        document.getElementById('scoring-panel').classList.add('hidden');
        document.getElementById('display-answer').style.display = 'none';

        if (remainingQuestions.length > 0) {
            document.getElementById('display-question').innerText = '準備好抽下一題了嗎？';
            document.getElementById('btn-draw-main').style.display = 'block';
        } else {
            document.getElementById('display-question').innerText = '🎉 所有題目皆已抽完！準備進行分數統計與排行！';
            document.getElementById('btn-draw-main').style.display = 'none';
            document.getElementById('btn-settlement-trigger').classList.remove('hidden');
        }
    }

    // ----------------- SETTLEMENT & LEADERBOARD -----------------
    function goToSettlement() {
        document.getElementById('phase-play').classList.add('hidden');
        document.getElementById('phase-settlement').classList.remove('hidden');

        const sortedPlayers = [...players].sort((a, b) => b.score - a.score);

        const container = document.getElementById('leaderboard-container');
        container.innerHTML = '';

        sortedPlayers.forEach((player, index) => {
            const row = document.createElement('div');
            row.className = `leaderboard-row rank-${Math.min(index, 3)}`;

            let medal = `${index + 1}`;
            if (index === 0) medal = '🥇';
            else if (index === 1) medal = '🥈';
            else if (index === 2) medal = '🥉';

            const avatarImgHtml = player.avatar
                ? `<img src="${player.avatar}">`
                : `<span class="emoji">👤</span>`;

            row.innerHTML = `
                <div class="rank-num">${medal}</div>
                <div class="lead-avatar">${avatarImgHtml}</div>
                <div class="lead-name">${player.name}</div>
                <div class="lead-score">${player.score} 分</div>
            `;
            container.appendChild(row);
        });
    }

    function restartGame() {
        if (confirm('確定要重新開始嗎？這將重置所有玩家分數，並重新匯入所有題目！')) {
            players.forEach(p => p.score = 0);
            remainingQuestions = [...questions];

            document.getElementById('phase-settlement').classList.add('hidden');
            document.getElementById('phase-play').classList.remove('hidden');

            document.getElementById('btn-settlement-trigger').classList.add('hidden');
            document.getElementById('btn-draw-main').style.display = 'block';
            document.getElementById('display-question').innerText = '準備好開始了嗎？';
            document.getElementById('display-answer').style.display = 'none';
            updatePlayCounter();
        }
    }
</script>
</body>
</html>
